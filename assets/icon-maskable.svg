    <rect x="220" y="200" width="72" height="40" rx="6" fill="#5c4630"/>
    <circle cx="232" cy="220" r="6" fill="#8ee7ff"/>
    <circle cx="256" cy="220" r="6" fill="#8ee7ff"/>
    <circle cx="280" cy="220" r="6" fill="#8ee7ff"/>
    <ellipse cx="420" cy="270" rx="36" ry="20" fill="#5c4630"/>
    <text x="256" y="430" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="#f5b027" letter-spacing="3">NAUTILUS</text>
  </g>
</svg>
