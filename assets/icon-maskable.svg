      <stop offset="0%" stop-color="#0a2a40"/>
      <stop offset="60%" stop-color="#020812"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5b027"/>
