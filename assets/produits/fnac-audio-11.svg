<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#081e31" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#020813" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8ee7ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2a44" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Fond marin studio Nautilus -->
  <rect width="320" height="320" rx="20" fill="url(#studioGlow)"/>
  <rect x="4" y="4" width="312" height="312" rx="16" fill="none" stroke="url(#cardFrame)" stroke-width="2"/>

  <!-- Halo lumineux d'exposition du produit -->
  <circle cx="160" cy="160" r="78" fill="#fb923c" opacity="0.10" filter="url(#softGlow)"/>

  <!-- En-tête : Badge Fnac Labège Retrait 1h en haut à droite -->
  <rect x="178" y="14" width="128" height="22" rx="6" fill="#f5b027"/>
  <text x="242" y="29" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="0.5">FNAC LABÈGE · 1H</text>

  <!-- Marque en haut à gauche -->
  <text x="18" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fb923c" letter-spacing="1.2">JBL</text>

  <!-- Rayon de magasin -->
  <text x="18" y="43" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.8">HOME CINÉMA & TV</text>

  <!-- Illustration vectorielle réaliste de l'article -->
  <g id="productArtwork">
    
        <!-- Ombre de contact au sol -->
        <ellipse cx="160" cy="204" rx="68" ry="12" fill="#000" opacity="0.6" filter="url(#dropBlur)"/>
        <!-- Boîtier principal cylindrique / enceinte -->
        <rect x="100" y="118" width="120" height="72" rx="26" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="2"/>
        <!-- Grille acoustique tressée -->
        <rect x="110" y="126" width="100" height="56" rx="18" fill="#111827" stroke="#fb923c" stroke-width="1.5"/>
        <!-- Motif perforé de la grille -->
        <line x1="118" y1="138" x2="202" y2="138" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
        <line x1="118" y1="146" x2="202" y2="146" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
        <line x1="118" y1="154" x2="202" y2="154" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
        <line x1="118" y1="162" x2="202" y2="162" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
        <line x1="118" y1="170" x2="202" y2="170" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
        <!-- Badge central de marque / logo -->
        <rect x="142" y="144" width="36" height="20" rx="4" fill="#030712" stroke="#fb923c" stroke-width="1.5"/>
        <text x="160" y="158" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="900" fill="#fb923c" text-anchor="middle">JBL</text>
        <!-- Radiateurs passifs latéraux en silicone -->
        <ellipse cx="98" cy="154" rx="5" ry="24" fill="#1f2937" stroke="#fb923c" stroke-width="1.5"/>
        <ellipse cx="222" cy="154" rx="5" ry="24" fill="#1f2937" stroke="#fb923c" stroke-width="1.5"/>
      
  </g>

  <!-- Ligne séparatrice néon -->
  <line x1="26" y1="234" x2="294" y2="234" stroke="#fb923c" stroke-width="1.5" opacity="0.45"/>

  <!-- Intitulé officiel Fnac de l'article -->
  <text x="160" y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eaf8ff" text-anchor="middle">Barre de son compacte TV JBL Bar…</text>

  <!-- Détail / Caractéristiques en rayon -->
  <text x="160" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#8ee7ff" opacity="0.85" text-anchor="middle">Dolby Digital · Puissance 80W · HDMI ARC &amp; Optique</text>

  <!-- Pastille officielle Fnac Labege -->
  <rect x="95" y="294" width="130" height="16" rx="8" fill="rgba(142,231,255,0.12)" stroke="rgba(142,231,255,0.3)" stroke-width="1"/>
  <text x="160" y="306" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#bbf2ff" text-anchor="middle" letter-spacing="0.8">EN STOCK RETRAIT 1H</text>
</svg>