<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#020812" />
  <title>Mission Nautilus — Le Juste Prix (Prototype)</title>
  <meta name="description" content="Prototype autonome du Palier 5 : Le Juste Prix du rayon Fnac sans tolérance et chronomètre 10s." />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/palier1.css?v=50">
  <link rel="stylesheet" href="css/palier5.css?v=2">
  <script src="anti-zoom.js?v=2"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #0c2b42 0%, #020812 85%);
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      color: #eaf8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .proto-wrap {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .proto-header {
      text-align: center;
      padding: 12px;
      background: rgba(4, 18, 32, 0.85);
      border: 1px solid rgba(142, 231, 255, 0.25);
      border-radius: 16px;
    }
    .proto-title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 1000;
      color: #ffd36c;
      letter-spacing: 0.05em;
    }
    .proto-desc {
      margin: 0;
      font-size: 13px;
      color: #8ee7ff;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="proto-wrap">
  <header class="proto-header">
    <h1 class="proto-title">⚓ LE JUSTE PRIX — PALIER 5</h1>
    <p class="proto-desc">10 articles Fnac Labège (retrait 1h) · Prix exact sans tolérance · Arrondi à l'euro près (87,98 € = 88 € · 112,90 € = 113 € · 34,50 € = 35 € · 11,49 € = 11 €) · 10s par réponse · 3 voyants rouges · Objectif ≥ 80% (8/10)</p>
  </header>

  <main id="justePrixHost"></main>
</div>

<script src="juste-prix.js?v=2"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var host = document.getElementById('justePrixHost');
    window.NautilusJustePrix.init(host, {
      equipe: 'TEST',
      onVictoire: function (res) {
        alert('🏆 VICTOIRE ! ' + res.score + ' articles trouvés en ' + res.duree + ' s. Direction le Palier 6 !');
      },
      onEchec: function (motif) {
        alert('🚨 ÉCHEC (' + motif + ') : Moins de 8 articles trouvés. Remontée en surface et blocage matelot !');
      }
    });
  });
</script>
</body>
</html>
