<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#020812" />
  <title>Mission Nautilus — Palier 5 : Le Juste Prix</title>
  <meta name="description" content="Mini-jeu du Palier 5 de la Mission Nautilus : Le Juste Prix des reliques de la Fnac." />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/palier1.css?v=61">
  <link rel="stylesheet" href="css/palier2.css?v=27">
  <link rel="stylesheet" href="css/palier5.css?v=5">
  <script src="anti-zoom.js?v=2"></script>
  <script>try { sessionStorage.setItem('nautilusEcoutille', '1'); } catch (_) {}</script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="topbar-back" id="backBtn" type="button">🏠 Retour à l'accueil</button>
    <div class="topbar-title" id="topPalierTitle">Palier 5 — Le Juste Prix</div>
  </div>
  <div class="topbar-info">
    <span>Équipage : <b id="topTeam">—</b></span>
  </div>
</div>

<main>
  <!-- ÉQUIPAGE ACTIF EN PLONGÉE -->
  <section class="card" id="teamCard" hidden>
    <h2>ÉQUIPAGE ACTIF EN PLONGÉE <span class="dive-lamp" id="diveLamp" title="Aucun matelot en plongée"></span></h2>
    <div class="body">
      <div class="crew" id="crewList"></div>
    </div>
  </section>

  <!-- JOURNAL DE BORD -->
  <section class="card" id="logCard" hidden>
    <h2>JOURNAL DE BORD</h2>
    <div class="body">
      <div class="morse-log">
        <h3 class="journal-titre">
          <span class="journal-titre-rule" aria-hidden="true"></span>
          <span class="journal-titre-label">Mouvements de l’équipage</span>
          <span class="journal-live-badge"><span class="journal-live-dot" aria-hidden="true"></span>En direct</span>
          <span class="journal-titre-rule" aria-hidden="true"></span>
        </h3>
        <ol class="morse-log-list" id="logList"></ol>
      </div>
    </div>
  </section>

  <!-- MINI-JEU DÉDIÉ : LE JUSTE PRIX -->
  <section class="card gate-unlocked epreuve-focus" id="gateUnlocked">
    <h2 class="card-h2-split" id="sasUnlockedTitle">
      <span>PALIER 5 — LE JUSTE PRIX</span>
    </h2>
    <div class="body">
      <div id="epreuveStatut" class="status-banner info">🎯 <b>Palier 5 en cours :</b> estimez le juste prix de 10 articles Fnac (8 réussites requises). 3 erreurs max par article.</div>
      <div id="epreuveHost" class="game-stage"></div>
    </div>
  </section>
</main>

<script src="son-partage.js?v=2"></script>
<script src="journal-bord.js?v=6"></script>
<script src="palier-sas.js?v=13"></script>
<script src="matelot-blocages.js?v=3"></script>
<script src="reserve-o2.js?v=9"></script>
<script src="equipage-actif.js?v=10"></script>
<script>window.EquipageActif.init();</script>
<script src="juste-prix.js?v=4"></script>
<script src="victoire-palier.js?v=18"></script>
<script src="records-palier.js?v=2"></script>
<script src="sonar-button.js?v=4" defer></script>
<script src="palier-annonces.js?v=5" defer></script>
<script src="admin-button.js?v=34" type="module"></script>

<script>
const LIEU_DESCRIPTION = "Rayon Fnac Kids & Papeterie";

(function () {
  'use strict';

  var CLE_BLOCAGE_ANONYME = 'nautilusEpreuve5BloqueJusqua';
  var BLOCAGE_MS = 60 * 60 * 1000;
  var _blocageSession = 0;

  var t0Partie = null;
  var partieEnCours = false;
  var moteurJeu = null;

  var $ = function (id) { return document.getElementById(id); };
  function journal(t, k) { if (window.JournalDeBord) window.JournalDeBord.addLogEntry(t, k || 'info'); }
  function acte(t, k, auteur) { if (window.JournalDeBord) window.JournalDeBord.addActe(t, k || 'info', auteur); }

  function enModeTest() {
    try { return (localStorage.getItem('nautilusMatelotCode') || '') === 'ZZZZ-0000'; } catch (e) { return false; }
  }
  function blocageAnonymeJusqua() {
    try { return Number(localStorage.getItem(CLE_BLOCAGE_ANONYME) || 0); } catch (e) { return 0; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function heureLisible(v) {
    var d = new Date(typeof v === 'number' ? v : String(v));
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  var _ident = null, _identLue = false;
  function monIdentite() {
    if (_identLue) return Promise.resolve(_ident);
    _identLue = true;
    return window.NautilusBlocages.identiteCourante()
      .then(function (i) { _ident = i; return _ident; })
      .catch(function () { _ident = null; return null; });
  }

  function apercuAdminAutorise() {
    try {
      if (!/[?&]apercu=jeu(?:&|$)/.test(location.search)) return false;
      var k = (location.search.match(/[?&]k=([a-z0-9]+)/) || [])[1];
      if (!k) return false;
      var h = 0, s = 'apercu-admin:NEMO2026';
      for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
      return k === ('k' + Math.abs(h).toString(36));
    } catch (e) { return false; }
  }

  function statut(html, kind) {
    var el = $('epreuveStatut');
    if (!el) return;
    el.innerHTML = html;
    el.className = 'status-banner ' + (kind || 'info');
    el.hidden = false;
  }

  function afficherBlocage(jusqua, nom, motif, hours, equipe) {
    partieEnCours = false;
    var host = $('epreuveHost');
    if (host && window.NautilusDefaite) {
      window.NautilusDefaite.afficher(host, {
        palier: 5,
        motif: motif,
        nom: nom,
        jusqua: jusqua,
        hours: hours,
        equipe: equipe,
        details: 'Moins de 8 articles trouvés sur 10'
      });
    }
  }

  function jouerSonDefaite() {
    try {
      if (window.NautilusAnnonces && window.NautilusAnnonces.playDefeatSound) {
        window.NautilusAnnonces.playDefeatSound();
      }
    } catch (e) {}
  }

  function declencherBlocage(motif) {
    motif = motif || 'score_insuffisant';
    jouerSonDefaite();

    var maintenant = Date.now();
    var jusquaDefaut = maintenant + BLOCAGE_MS;
    var nomLocal = (function () {
      try { return localStorage.getItem('nautilusMatelotName') || localStorage.getItem('nautilusMatelotNom') || ''; }
      catch (_) { return ''; }
    })() || (_ident && _ident.name) || 'Matelot';
    var equipeLocale = (_ident && _ident.teamCode) || (function () {
      try { return localStorage.getItem('nautilusCurrentTeam') || ''; } catch (_) { return ''; }
    })() || 'Nemo';

    // Affichage IMMÉDIAT synchrone de la page de défaite
    afficherBlocage(jusquaDefaut, nomLocal, motif, 1, equipeLocale);

    if (apercuAdminAutorise()) {
      journal('ℹ️ Aperçu organisateur : écran de défaite affiché (aucun blocage réel enregistré).', 'info');
      return;
    }

    monIdentite().then(function (ident) {
      if (ident && ident.isTest) {
        journal('🧪 Mode concepteur : écran de défaite affiché pour ' + ident.name + ' (aucun blocage en test).', 'info');
        return;
      }
      if (ident) {
        window.NautilusBlocages.poserBlocage(ident, motif)
          .then(function (r) {
            afficherBlocage(r.lockedUntil, ident.name, motif, r.hours, ident.teamCode);
            acte('échec au Juste Prix (' + motif + ') — remonte en surface (' + r.hours + ' h)', 'danger', ident.name);
          })
          .catch(function () {
            _blocageSession = jusquaDefaut;
            afficherBlocage(_blocageSession, ident.name, motif, 1, ident.teamCode);
            journal('⚠️ Blocage personnel non inscrit (connexion ?).', 'warning');
          });
        return;
      }
      var jusqua = Date.now() + BLOCAGE_MS;
      try { localStorage.setItem(CLE_BLOCAGE_ANONYME, String(jusquaDefaut)); } catch (e) {}
    }).catch(function () {});
  }

  async function propagerVictoire(res) {
    var ident = await monIdentite();
    var equipage = (ident && !ident.isTest && ident.teamCode) || localStorage.getItem('nautilusCurrentTeam') || null;
    if (!equipage || enModeTest() || apercuAdminAutorise()) {
      journal("ℹ️ Mode test / aperçu : la victoire n'est pas inscrite au tableau de bord.", 'info');
      return;
    }
    try {
      var x = await window.NautilusBlocages.db();
      await x.fs.updateDoc(x.fs.doc(x.db, 'teams', equipage), {
        completedSteps: x.fs.arrayUnion('occasion'),
        currentStep: 'livres',
        lastEvent: 'step_advanced',
        lastStepCompleted: 'occasion',
        lastStepCompletedAt: new Date().toISOString(),
        lastStepCompletedLabel: 'Palier 5',
        lastStepCompletedBy: (ident && !ident.isTest) ? ident.name : 'Un matelot'
      });
      if (typeof window.NautilusRecords !== 'undefined') {
        var NOMS_EQUIPES = { NEMO: 'Nemo', NAUTILUS: 'Nautilus', ARONNAX: 'Aronnax', NEDLAND: 'Ned Land' };
        var dureeSec = t0Partie ? Math.max(0, Math.round((Date.now() - t0Partie) / 1000)) : 0;
        window.NautilusRecords.enregistrer({
          stepId: 'occasion',
          seconds: dureeSec,
          matelot: (ident && !ident.isTest) ? ident.name : 'Un matelot',
          equipage: NOMS_EQUIPES[ident.teamCode] || ident.teamCode
        }).then(chargerRecords);
      }
      var leves = await window.NautilusBlocages.leverBlocages(equipage, 'occasion');
      journal('📈 Victoire inscrite au tableau de bord — direction le Palier 6 !'
        + (leves > 0 ? ' ' + leves + ' matelot' + (leves > 1 ? 's' : '') + ' débloqué' + (leves > 1 ? 's' : '') + '.' : ''), 'success');
    } catch (e) {
      journal("⚠️ Victoire non inscrite (connexion ?). Préviens l'organisation.", 'warning');
    }
  }

  async function afficherEcranVictoire(res) {
    var host = $('epreuveHost');
    if (!host || !window.NautilusVictoire) return;
    var ident = await monIdentite();
    var duree = t0Partie ? Math.max(0, Math.round((Date.now() - t0Partie) / 1000)) : 0;
    var mm = Math.floor(duree / 60), ss = ('0' + (duree % 60)).slice(-2);
    var NOMS = { NEMO: 'Nemo', NAUTILUS: 'Nautilus', ARONNAX: 'Aronnax', NEDLAND: 'Ned Land' };
    var equipe = (ident && !ident.isTest && ident.teamCode) ? (NOMS[ident.teamCode] || ident.teamCode) : null;
    var nbTrouves = res && res.score != null ? res.score : 8;
    window.NautilusVictoire.afficher(host, {
      palier: 5,
      mission: 'Palier 5',
      equipe: equipe,
      bravo: (ident && !ident.isTest) ? ident.name : null,
      stats: [
        { valeur: mm + ':' + ss, label: 'Temps utilisé' },
        { valeur: nbTrouves + '/10', label: 'Articles trouvés' }
      ],
      indication: LIEU_DESCRIPTION,
      labelSuivant: 'Palier 6',
      urlSuivante: '21617141023.html'
    });
    chargerRecords();
  }

  function chargerRecords() {
    if (typeof window.NautilusRecords === 'undefined') return;
    monIdentite().then(function (ident) {
      window.NautilusRecords.chargerEtRendre($('wonRecordsHost'), {
        stepId: 'occasion',
        moi: (ident && !ident.isTest) ? ident.name : ''
      });
    });
  }

  function onVictoire(res) {
    partieEnCours = false;
    var duree = t0Partie ? Math.max(0, Math.round((Date.now() - t0Partie) / 1000)) : 0;
    statut('🏆 <b>Palier 5 franchi !</b> Vous avez estimé avec succès les articles Fnac.', 'success');
    acte('valide le Palier 5 (Le Juste Prix)' + (duree ? ' en ' + duree + ' s' : ''), 'success');
    propagerVictoire(res);
    afficherEcranVictoire(res);
  }

  async function preparerJeu() {
    if (/[?&]apercu=(?:defaite|blocage)\b/.test(location.search) || /[?&]test=defaite\b/.test(location.search)) {
      var nomApercu = (function () {
        try { return localStorage.getItem('nautilusMatelotName') || ''; } catch (_) { return ''; }
      })() || 'Matelot';
      afficherBlocage(Date.now() + 3600000, nomApercu, 'score_insuffisant', 1, 'Nemo');
      return;
    }
    var ident = null;
    if (!apercuAdminAutorise()) {
      ident = await monIdentite();
      if (ident && !ident.isTest) {
        var bloc = await window.NautilusBlocages.blocageActif(ident);
        if (bloc) {
          afficherBlocage(bloc.lockedUntil, ident.name, bloc.reason);
          journal('🔒 <b>' + esc(ident.name) + '</b> est en surface jusqu’à ' + heureLisible(bloc.lockedUntil)
            + ' : un coéquipier peut continuer les estimations avec son Code Matelot.', 'warning');
          return;
        }
      } else if (!ident) {
        var jusqua = blocageAnonymeJusqua();
        if (jusqua > Date.now()) { afficherBlocage(jusqua, null, 'anonyme'); return; }
      }
    }

    statut('🎯 <b>Épreuve prête.</b> Déclenchez le chronomètre pour commencer l’estimation des 10 articles.', 'info');
    var host = $('epreuveHost');
    if (!host) return;
    host.innerHTML =
      '<div class="launcher-card" style="text-align:center; padding: 24px 16px; background: rgba(3, 16, 28, 0.85); border: 1.5px solid rgba(142, 231, 255, 0.35); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">'
      + '  <div style="font-size: 44px; margin-bottom: 12px;">⏱️</div>'
      + '  <h3 style="font-size: 20px; font-weight: 900; color: #8ee7ff; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 0.05em;">Chronomètre 10s par Article</h3>'
      + '  <p style="font-size: 15px; line-height: 1.5; color: #d0e7f7; margin: 0 auto 20px auto; max-width: 480px;">'
      + '    Vous avez <b>10 secondes par article</b> pour estimer son prix réel Fnac en euros (8 réussites sur 10 requises, 3 erreurs max par article). Le chronomètre démarrera dès votre clic.'
      + '  </p>'
      + '  <button type="button" id="btnDemarrerChronoP5" class="btn btn-primary" style="font-size: 16px; font-weight: 900; padding: 14px 26px; border-radius: 14px; width: 100%; max-width: 380px; box-shadow: 0 4px 18px rgba(245, 176, 39, 0.4); cursor: pointer;">'
      + '    ⏱️ DÉMARRER LE CHRONOMÈTRE'
      + '  </button>'
      + '</div>';

    var btn = $('btnDemarrerChronoP5');
    if (btn) {
      btn.addEventListener('click', function () {
        demarrer(ident);
      });
    }
  }

  function demarrer(ident) {
    t0Partie = Date.now();
    partieEnCours = true;
    statut('🎯 <b>Évaluation en cours :</b> estimez le juste prix de chaque article avant la fin du chronomètre.', 'info');

    var isTest = enModeTest() || apercuAdminAutorise() || !!(ident && ident.isTest);
    var equipageCode = isTest ? 'TEST' : ((ident && ident.teamCode) || localStorage.getItem('nautilusCurrentTeam') || 'NEMO');

    moteurJeu = window.NautilusJustePrix.init($('epreuveHost'), {
      equipe: equipageCode,
      isTest: isTest,
      onVictoire: function (res) {
        partieEnCours = false;
        onVictoire(res);
      },
      onEchec: function (motif) {
        partieEnCours = false;
        declencherBlocage(motif || 'score_insuffisant');
      },
      onAbandon: function () {
        partieEnCours = false;
        declencherBlocage('abandon');
      }
    });
  }

  function intercepterSortie(e) {
    if (partieEnCours) {
      var conf = confirm("⚠️ Quitter le mini-jeu en cours entraîne la remontée en surface (blocage matelot). Confirmez-vous l’abandon ?");
      if (conf) {
        declencherBlocage('sortie_jeu');
      } else {
        if (e) e.preventDefault();
        return false;
      }
    }
  }

  var btnAccueilTop = $('backBtn');
  if (btnAccueilTop) {
    btnAccueilTop.addEventListener('click', function (e) {
      if (partieEnCours) {
        if (!intercepterSortie(e)) return;
      }
      location.href = 'index.html?ecoutille=0';
    });
  }

  window.addEventListener('beforeunload', function () {
    if (partieEnCours && !apercuAdminAutorise()) {
      declencherBlocage('sortie_jeu');
    }
  });

  // Contrôle d'accès au sas
  if (!apercuAdminAutorise() && !enModeTest()) {
    if (!window.NautilusSas.estDeverrouille(5)) {
      location.href = '2051613922.html' + (location.search || '');
      return;
    }
  }

  // Initialisation : préparation de l'épreuve avec action obligatoire
  preparerJeu();
})();
</script>
</body>
</html>
